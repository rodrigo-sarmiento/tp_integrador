<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carreras del instituto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="bg-light text-dark" style="padding-top: 150px;">

  <!-- NAVBAR -->
 <nav class="navbar navbar-expand-lg bg-primary navbar-dark py-6 fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="/" onclick="event.preventDefault(); location.reload();">
      <img src="img/logo.png" alt="Logo del Instituto" class="logo-navbar">
     </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon bg-light rounded"></span>
    </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Institucional</a> <!-- Enlace a la página principal -->
            </li>
            <li class="nav-item">
              <a class="nav-link" href="categorias.html">Categoria</a>
          </ul>
        </div>
      </div>
    </nav>

  <div class="container py-5">
      <h1 class="seccion-texto">Carreras del instituto</h1>
  
      <section class="mb-5 panel">
        <h2 class="seccion-texto">Registrar Carrera</h2>
        <div class="mb-3">
          <input type="text" id="careerCode" class="form-control dark-input mb-2" placeholder="Código de carrera">
          
          <select id="careerType" class="form-control dark-input mb-2">
            <option value="">Tipo de carrera</option>
            <option value="licenciatura">Licenciatura</option>
            <option value="tecnicatura">Tecnicatura</option>
            <option value="diplomatura">Diplomatura</option>
            <option value="curso">Curso</option>
            <option value="certificación">Certificación</option>
          </select>
      
        <select id="careerCategory" class="form-control dark-input mb-2">
          <option value="" disabled selected>Categoría*</option>
        </select>
      
          <textarea id="careerName" class="form-control dark-input mb-2" placeholder="Nombre completo de la carrera"></textarea>
      
          <button class="btn btn-warning glow" onclick="registerCareer()">Registrar carrera</button>
        </div>
      
        <pre id="careerRegisterResult" class="bg-dark p-3 border rounded text-success terminal-box"></pre>
      </section>
    </div>

    <div class="container mt-5">
  <h2>Listado de Carrera</h2>
  <table id="tabla-estudiantes" class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Correo</th>
        <th>Carrera</th>
      </tr>
    </thead>
    <tbody>
      <!-- Acá se insertarán las filas con JS -->
    </tbody>
  </table>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
